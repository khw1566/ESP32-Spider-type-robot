# 학교 PC (i9-13900 24코어/32스레드, RTX 3050, Windows) 8시간 세션용 덮어쓰기
ppo:
  n_envs: 24          # 코어 수에 맞춤. CPU 사용률이 100%에 못 미치면 늘리고, 느려지면 줄인다
  n_steps: 512
  batch_size: 6144
  device: cpu         # 소형 MLP는 CPU가 빠른 경우가 많음. GPU 비교 실험은 --device cuda:0
train:
  max_hours: 7.5      # 재부팅 초기화 전 자동 저장·종료
  checkpoint_every: 2000000
